name: Build test pipeline

on:
  pull_request:
    branches:
      - main
      - devel
      - feat/*
  workflow_dispatch:

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies (Backend)
        working-directory: backend
        run: npm ci

      - name: Eslint (Backend)
        working-directory: backend
        run: npx eslint ./src

      - name: Run Tests (Backend)
        working-directory: backend
        run: npm test

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci

      - name: Run Tests (Frontend)
        working-directory: frontend
        run: npm test

      - name: Run Docker compose (Production)
        run: |
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify Frontend
        run: |
          echo "Waiting for frontend..."
          sleep 10
          if curl -f -k https://localhost > /dev/null; then
             echo "Frontend is reachable!"
          else
             echo "Frontend failed to respond."
             # Debug info
             docker compose -f docker-compose.prod.yml logs frontend
             docker compose -f docker-compose.prod.yml logs traefik
             exit 1
          fi

      - name: Verify Backend
        run: |
          echo "Waiting for backend..."
          sleep 10
          
          if docker compose -f docker-compose.prod.yml exec -T app node -e 'fetch("http://localhost:8000/api/health").then(r => r.ok ? process.exit(0) : process.exit(1))'; then
             echo "Backend is healthy (checked via internal node fetch)!"
          else
             echo "Backend health check failed."
             docker compose -f docker-compose.prod.yml logs app
             exit 1
          fi

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.prod.yml down
